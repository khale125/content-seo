# --- Khoảng trống ---
gap_type: "thieu-cu-the"
gap_evidence: >-
  Cả 5 kết quả top đều liệt kê điềm báo rất dài nhưng phần "vì sao chuồn chuồn bay vào nhà" thì
  bỏ trống hoặc viết chung chung không nguồn: invert.vn (#3) không có phần này, mogi.vn (#4) chỉ
  nhắc chuồn chuồn là côn trùng, happynest.vn (#1) và sbshouse.vn (#2) có mục vì sao nhưng không
  dẫn một nguồn nào. Bài đang đăng của Muaban.net cũng không có mục này.
unique_angle: >-
  Giải thích hiện tượng bằng nguồn bình duyệt — chuồn chuồn nhận mặt nước qua ánh sáng phân cực
  ngang nên lao vào mái tôn, sân ướt, cửa kính — cộng hướng dẫn đưa chuồn chuồn ra ngoài mà không
  giết nó, dựa trên số muỗi một con ăn mỗi ngày. Không kết quả nào trong top 5 có cả hai.

